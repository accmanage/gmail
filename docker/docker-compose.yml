services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: secure_admin
      MYSQL_USER: secure_admin
      MYSQL_PASSWORD: secure_admin_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "4000"

  admin-frontend:
    build:
      context: ..
      dockerfile: apps/admin-frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  user-frontend:
    build:
      context: ..
      dockerfile: apps/user-frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin-frontend
      - user-frontend

volumes:
  mysql_data:
